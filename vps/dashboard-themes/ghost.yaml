# Starter theme: Ghost in the Shell (1995). Batou's hq/ghost.yaml in
# ghost-in-the-machine replaces it once it exists (section9-hq-crew fetches it).
name: ghost
label: Ghost in the Shell
description: Near-black, phosphor green and cyan, monospace, scanlines

palette:
  background:
    hex: "#040806"
    alpha: 1.0
  midground: "#3dff9a"
  foreground:
    hex: "#ffffff"
    alpha: 0.0
  warmGlow: "rgba(0, 229, 255, 0.18)"
  noiseOpacity: 0.5

typography:
  fontSans: "ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace"
  fontMono: "ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace"
  baseSize: "14px"
  lineHeight: "1.55"
  letterSpacing: "0.02em"

layout:
  radius: "0"
  density: compact

layoutVariant: cockpit

colorOverrides:
  primary: "#3dff9a"
  accent: "#00e5ff"
  ring: "#00e5ff"
  border: "#134d33"
  destructive: "#ff4d6d"

customCSS: |
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.28) 3px
    );
  }
  h1, h2, h3 {
    text-transform: uppercase;
    text-shadow: 0 0 6px rgba(61, 255, 154, 0.55);
  }
  a { color: #00e5ff; }
