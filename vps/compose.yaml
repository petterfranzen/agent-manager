# Section 9 on the VPS: Hermes + the sandbox. See docs/migration-vps.md.
# Secrets live in /etc/section9/ (root-only), never in this public repo.
# Images are pinned by digest; updates only once a release is 24 h old.

name: section9

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The board's CSP allows only its own inline scripts, by hash (vps/board/index.html and
# placeholder.html); scripts/vps_tests/hq_sca.py fails CI when a page changes without it.
x-hq-caddyfile: &hq-caddyfile |
  {
  	admin off
  	auto_https off
  }
  (board_headers) {
  	header {args[0]} {
  		Content-Security-Policy "default-src 'none'; script-src 'sha256-eVdIWHw/Na4kKCdX3WeYJysPUAuLO7hrpuPYTfq+fZQ=' 'sha256-pRbsgQ0/SkXo0MjSFdFvV+ot6b7Pz85vsiIuFSuLwt4='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  		X-Frame-Options DENY
  		X-Content-Type-Options nosniff
  		Referrer-Policy no-referrer
  	}
  }
  # The crew page, and /board for the old hq.sectionnine.dev/board route until it is removed.
  :8090 {
  	root * /srv
  	header X-Content-Type-Options nosniff
  	import board_headers /board*
  	file_server
  }
  # board.sectionnine.dev: the board folder only, at the root (old /board/ links still work).
  :8091 {
  	import board_headers *
  	root * /srv/board
  	redir /board /
  	uri /board/* strip_prefix /board
  	file_server
  }

services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      - sandbox
    # Host network so the API can listen on the host's loopback only: from a
    # bridge network it would have to bind 0.0.0.0, where the sandbox could
    # reach it. The sandbox's sshd is published on 127.0.0.1:2222 for it.
    network_mode: host
    # OPENROUTER_API_KEY, API_SERVER_KEY, and the dashboard's basic-auth login
    # (HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD/_SECRET, made by install.sh).
    env_file: /etc/section9/hermes.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      # The web dashboard (hq.sectionnine.dev): loopback only, cloudflared and
      # Cloudflare Access in front, basic auth as the second layer. It can edit
      # .env and open a shell, so treat it like SSH. The login is demanded
      # because dashboard.public_url (hermes/config.yaml) is set: Hermes v0.22.5
      # gates a non-loopback bind or a non-loopback public_url. Don't bind
      # 0.0.0.0 here: with host networking that listens on every interface.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
      WEBHOOK_ENABLED: "false"
      # Commands run in the sandbox over SSH; Hermes never forwards provider
      # credentials over SSH, so the OpenRouter key can't reach agent commands.
      TERMINAL_SSH_HOST: "127.0.0.1"
      TERMINAL_SSH_PORT: "2222"
      TERMINAL_SSH_USER: agent
      TERMINAL_SSH_KEY: /opt/data/ssh/id_ed25519
    volumes:
      - hermes-data:/opt/data
      - ../hermes/config.yaml:/opt/data/config.yaml:ro
      # Dashboard themes, written by section9-hq-crew (hq/*.yaml from
      # ghost-in-the-machine, else the starter in vps/dashboard-themes/).
      - /var/lib/section9/dashboard-themes:/opt/data/dashboard-themes:ro
      # Owned by UID 10000 (the image's hermes user), mode 0400.
      - /etc/section9/hermes_ssh_key:/opt/data/ssh/id_ed25519:ro
    # 512m ran at 98% once the dashboard shared the container (1 Nov), and the host
    # paged it (36% iowait). 1g still leaves the sandbox its 2g on a 3.9 GB host with 4 GB swap.
    mem_limit: 1g
    # Hostinger bills core-seconds above a 25% baseline. 0.40 (sandbox) + 0.30 (here) =
    # 0.70 core, i.e. 0.45 over baseline = 1,620 credits/hour: a full 8,100-credit
    # balance is 5 h at the cap, and Tachikoma's 3 h night is 4,860 (60% of it). Uncapped,
    # the 1 Nov night burned the balance and the panel took the limit back
    # (section9-hq #34). Keep SANDBOX_CORES/HERMES_CORES in vps/dispatch.py in step.
    cpus: "0.3"
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  sandbox:
    build: ../sandbox
    restart: unless-stopped
    env_file:
      - /etc/section9/sandbox.env         # GH_TOKEN (fine-grained)
      # CS_ACCESS_TOKEN for the `cs` CLI. Optional: without the file the sandbox
      # starts as before and `cs review` says it has no token (Compose 2.24+).
      - path: /etc/section9/codescene.env
        required: false
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - /etc/section9/sandbox_authorized_keys:/etc/ssh/authorized_keys/agent:ro
      - sandbox-hostkeys:/etc/ssh/hostkeys
      - sandbox-work:/home/agent/work
      - sandbox-tools:/home/agent/.local/share/mise
    # A runaway build or page is OOM-killed here, not allowed to starve the host.
    mem_limit: 2g
    memswap_limit: 3g
    # A CFS quota, not a hint: a single-threaded build that used a whole core runs ~2.5x
    # slower in its CPU-bound stretches. Tachikoma's 3 h night at this cap is 4,860
    # credits; three long nights in a row is the signal to raise it and cut the build.
    cpus: "0.4"
    pids_limit: 512
    # Only the capabilities the entrypoint and sshd need: CHOWN/DAC_OVERRIDE/FOWNER to write the
    # agent's token files as root, SETUID/SETGID/SYS_CHROOT for sshd's privilege separation,
    # KILL for sshd to signal the agent's session, AUDIT_WRITE for PAM's login records.
    # No setuid binary gains privileges. The root filesystem stays writable: the agent's
    # home (build caches) and /tmp would otherwise have to be RAM tmpfs inside the 2 GB cap
    # or persistent volumes, and the agent user can't write the image's root-owned files.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT, KILL, AUDIT_WRITE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Crew page: the crew page plus a live status.json, static files only, on
  # loopback, kept for later public use. hq.sectionnine.dev now points at the
  # Hermes dashboard (port 9119) instead. The files come from vps/hq-status.py.
  # :8091 serves only the board folder, at the root, for its own hostname
  # (board.sectionnine.dev), so the board never shares the dashboard's origin.
  hq:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    # The Caddyfile lives below (x-hq-caddyfile), in this file, so a change to it is a
    # compose change the sync applies. Compose can't inject a config file into a
    # read-only container, so the entrypoint writes it to the /config tmpfs.
    command: ["sh", "-c", "printf '%s' \"$$HQ_CADDYFILE\" > /config/Caddyfile && exec caddy run --config /config/Caddyfile --adapter caddyfile"]
    environment:
      HQ_CADDYFILE: *hq-caddyfile
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    volumes:
      - /var/lib/section9/hq:/srv:ro
    tmpfs:
      - /data
      - /config
    read_only: true
    cap_drop: [ALL]
    # Caddy's binary carries the cap_net_bind_service file capability; without it in the
    # bounding set the exec fails, even though :8090 isn't a privileged port.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    logging: *logging

volumes:
  hermes-data:
  sandbox-hostkeys:
  sandbox-work:
  sandbox-tools:
