.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .ja{color:var(--amber);font-size:.85rem;letter-spacing:.12em;white-space:nowrap}
h1{

}

}
.theme-toggle:hover{border-color:var(--line-strong);color:var(--ink)}

.hint{color:var(--muted);font-size:.78rem;margin:0}

.lane{

}
.lane-top{display:flex;align-items:center;gap:9px;min-width:0}

.lane-id{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.lane-id .name{font-family:var(--font-display);font-size:1.05rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.state{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--state-sleeping);box-shadow:0 0 6px currentColor;flex:none}
.state-working{color:var(--state-working)}
.state-working .dot{background:var(--state-working)}
.state-idle{color:var(--state-idle)}
.state-idle .dot{background:var(--state-idle)}

.column{

.unblocks{color:var(--petter);border:1px solid var(--petter);padding:0 .4em;font-size:.68rem;white-space:nowrap}
.empty{color:var(--muted);font-size:.76rem;font-style:italic;padding:3px 2px}
.error{border:1px solid var(--warn);color:var(--warn);padding:12px 14px;background:rgba(255,138,92,.06)}

@media (max-width:700px){

@media (max-width:560px){

@media (prefers-reduced-motion:no-preference){

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script>
(function () {
  'use strict';

  var AVATAR_BASE = 'https://raw.githubusercontent.com/petterfranzen/ghost-in-the-machine/main/crew/avatars/';
  var ROSTER = [
    { id: 'major',     name: 'Major',     role: 'Coordinator',     avatar: AVATAR_BASE + 'major.png' },
    { id: 'aramaki',   name: 'Aramaki',   role: 'Chief',           avatar: AVATAR_BASE + 'aramaki.png' },
    { id: 'batou',     name: 'Batou',     role: 'Coder',           avatar: AVATAR_BASE + 'batou.png' },
    { id: 'tachikoma', name: 'Tachikoma', role: 'Nightly builder', avatar: AVATAR_BASE + 'tachikoma.png' },
    { id: 'togusa',    name: 'Togusa',    role: 'QA',              avatar: AVATAR_BASE + 'togusa.png' },
    { id: 'ishikawa',  name: 'Ishikawa',  role: 'Researcher',      avatar: AVATAR_BASE + 'ishikawa.png' },
    { id: 'saito',     name: 'Saito',     role: 'Ops',             avatar: AVATAR_BASE + 'saito.png' }
  ];
  var WAITS = [
    { key: 'petter', label: 'Needs Petter',                sub: 'a decision, approval or answer' },
    { key: 'major',  label: 'Needs the Major',             sub: 'apply, merge, route or close' },
    { key: 'qa',     label: 'In QA',                       sub: 'PR open and green, waiting for Togusa' },
    { key: 'agent',  label: 'With an agent',               sub: 'an agent has changes to make' },
    { key: 'task',   label: 'Waiting behind another task', sub: 'nothing to do until something else lands' }
  ];
  var START_LIMIT = 3;
  var POLL_MS = 60000;
  var STATUSES = ['todo', 'working', 'review', 'blocked', 'done'];
  var state = { data: null, filter: 'all', source: 'loading' };

  var lanesEl = document.getElementById('lanes');
  var startEl = document.getElementById('start-here');
  var chipsEl = document.getElementById('chips');
  var columnsEl = document.getElementById('columns');
  var metaEl = document.getElementById('meta');
  var budgetEl = document.getElementById('budget');
  var filterLineEl = document.getElementById('filter-line');
  var liveEl = document.getElementById('live');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function stateOf(s) {
    var v = String(s || '').toLowerCase();
    if (v === 'working' || v === 'active') return 'working';
    if (v === 'idle') return 'idle';
    if (v === 'blocked') return 'blocked';
    return 'sleeping'; // paused, off, sleeping, unknown
  }

  function rosterOf(id) {
    for (var i = 0; i < ROSTER.length; i++) if (ROSTER[i].id === id) return ROSTER[i];
    return null;
  }

  function waitsMeta(key) {
    for (var i = 0; i < WAITS.length; i++) if (WAITS[i].key === key) return WAITS[i];
    return null;
  }

  function rel(iso) {
    var t = Date.parse(iso);
    if (!isFinite(t)) return '—';
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + 's';
    var m = Math.round(s / 60);
    if (m < 60) return m + 'm';
    var h = Math.round(m / 60);
    if (h < 48) return h + 'h';
    var d = Math.round(h / 24);
    return d + 'd';
  }

  function abs(iso) {
    var t = Date.parse(iso);
    if (!isFinite(t)) return '';
    try { return new Date(t).toISOString().replace('T', ' ').replace('.000Z', 'Z'); }
    catch (e) { return iso; }
  }

  // "Waits on the tunnel rule" -> "the tunnel rule" (the line the card shows).
  function cleanWaits(txt) {
    return String(txt == null ? '' : txt).replace(/^\s*waits\s+on\s*[:\-\u2013\u2014]?\s*/i, '').trim();
  }

  // Raw board.json (old or new) -> display model.
  function normalize(raw) {
    raw = raw || {};
    var records = {};
    (raw.agents || []).forEach(function (a) {
      var id = String(a.id || a.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      var rec = {
        id: id, name: a.name || id, role: a.role || '', state: stateOf(a.state),
        task: a.now || '', model: a.model || raw.model || '—', lastActiveAt: a.lastActiveAt || null,
        runsPerDay: typeof a.runsPerDay === 'number' ? a.runsPerDay : null,
        capUsd: typeof a.budgetMonthlyUsd === 'number' ? a.budgetMonthlyUsd : null,
        week: a.week && typeof a.week === 'object' ? a.week : null
      };
      records[id] = rec;
      records[String(a.name || '').toLowerCase()] = rec;
    });
    var tasks = (raw.tasks || []).map(function (t) {
      var st = String(t.status || 'todo').toLowerCase();
      if (STATUSES.indexOf(st) < 0) st = 'todo';
      var w = String(t.waits || '').toLowerCase();
      if (!waitsMeta(w)) w = 'agent'; // unknown label: treat as an agent's job
      return {
        id: t.id,
        title: t.title || 'On a task',
        agent: String(t.agent || 'unassigned').toLowerCase(),
        status: st,
        waits: w,
        waitsText: typeof t.waitsText === 'string' ? t.waitsText : '',
        pr: (typeof t.pr === 'string' && /^https?:\/\//i.test(t.pr)) ? t.pr : null,
        url: (typeof t.url === 'string' && /^https?:\/\//i.test(t.url)) ? t.url : null,
        blocks: (typeof t.blocks === 'number' && isFinite(t.blocks)) ? t.blocks : null,
        updated: t.updated || raw.generatedAt || null
      };
    }).filter(function (t) { return t.status !== 'done'; }); // the board is open tasks only
    var agents = ROSTER.map(function (r) {
      var rec = records[r.id];
      if (rec) {
        return { id: r.id, name: r.name, role: rec.role || r.role, avatar: r.avatar,
                 state: rec.state, task: rec.task, model: rec.model, lastActiveAt: rec.lastActiveAt,
                 runsPerDay: rec.runsPerDay, capUsd: rec.capUsd, week: rec.week };
      }
      var mine = tasks.filter(function (t) { return t.agent === r.id; });
      var working = mine.filter(function (t) { return t.status === 'working'; })[0];
      var blocked = mine.filter(function (t) { return t.status === 'blocked'; })[0];
      var review = mine.filter(function (t) { return t.status === 'review'; })[0];
      var st = working ? 'working' : blocked ? 'blocked' : review ? 'idle' : 'sleeping';
      return { id: r.id, name: r.name, role: r.role, avatar: r.avatar, state: st,
               task: (working || blocked || review || {}).title || '', model: raw.model || '—', lastActiveAt: null };
    });
    return {
      generatedAt: raw.generatedAt || null,
      budget: raw.budget || null,
      capacityAsOf: raw.capacityAsOf || null,
      model: raw.model || '—',
      sample: raw.sample === true,
      agents: agents,
      tasks: tasks
    };
  }

  function filteredTasks(d) {
    if (state.filter === 'all') return d.tasks.slice();
    return d.tasks.filter(function (t) { return t.agent === state.filter; });
  }

  // How many open tasks mention each issue (#NN) in their "waits on" line.
  function refCounts(tasks) {
    var counts = {};
    tasks.forEach(function (t) {
      var m = String(t.waitsText || '').match(/#\d+/g) || [];
      m.forEach(function (r) { var n = r.slice(1); counts[n] = (counts[n] || 0) + 1; });
    });
    return counts;
  }

  function startHere(d) {
    var counts = refCounts(d.tasks);
    var petter = d.tasks.filter(function (t) { return t.waits === 'petter'; });
    petter.forEach(function (t) {
      // Prefer the count the server sends; fall back to counting "#NN" references.
      t.unblocks = (t.blocks != null) ? t.blocks : (counts[String(t.id)] || 0);
    });
    petter.sort(function (a, b) {
      return (b.unblocks - a.unblocks) || ((Date.parse(b.updated) || 0) - (Date.parse(a.updated) || 0));
    });
    return petter.slice(0, START_LIMIT);
  }

  function themeMode() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function setTheme(mode) {
    var m = mode === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', m);
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', m === 'light' ? '#f3f7f4' : '#060b09');
    try { localStorage.setItem('s9-board-theme', m); } catch (e) {}
  }

  function renderMeta(d) {
    var bits = [];
    if (d.generatedAt) bits.push('as of <b title="' + esc(abs(d.generatedAt)) + '">' + esc(rel(d.generatedAt)) + ' ago</b>');
    if (d.budget && d.budget.usedPercent != null) bits.push('budget <b>' + esc(d.budget.usedPercent) + '%</b>');
    if (d.model) bits.push('model <b>' + esc(d.model) + '</b>');
    if (state.source === 'file' || state.source === 'sample' || d.sample) {
      bits.push('<span class="sample-badge" title="Sample data — the live feed is not published here.">Sample data</span>');
    }
    var m = themeMode();
    bits.push('<button type="button" class="theme-toggle" aria-label="Switch to the ' + (m === 'light' ? 'dark' : 'light') +
      ' theme">theme <b>' + m + '</b></button>');
    metaEl.innerHTML = bits.join(' <span aria-hidden="true">·</span> ');
  }

  function money(n) { return '$' + Number(n).toFixed(2); }
  function isNum(n) { return typeof n === 'number' && isFinite(n); }

  // Only the board copy carries dollar amounts; without them the strip stays hidden.
  function renderBudget(d) {
    var b = d.budget;
    if (!b || !isNum(b.usedUsd) || !isNum(b.capUsd)) { budgetEl.hidden = true; return; }
    var bits = [money(b.usedUsd) + ' of ' + money(b.capUsd) + ' this month'];
    if (isNum(b.leftUsd)) bits.push(money(b.leftUsd) + ' left');
    if (isNum(b.todayUsd)) bits.push('today ' + money(b.todayUsd));
    var pct = Math.max(0, Math.min(100, isNum(b.usedPercent) ? b.usedPercent : (b.capUsd ? 100 * b.usedUsd / b.capUsd : 0)));
    var t = Date.parse(d.capacityAsOf || d.generatedAt || '');
    var when = '';
    if (isFinite(t)) {
      try {
        when = new Date(t).toLocaleString('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit',
          day: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' CET';
      } catch (e) { when = ''; }
    }
    budgetEl.innerHTML = '<span><b>' + esc(bits[0]) + '</b>' + esc(bits.slice(1).map(function (x) { return ' \u00b7 ' + x; }).join('')) + '</span>' +
      '<span class="bar" role="img" aria-label="' + esc(Math.round(pct)) + '% of the monthly cap used"><i style="width:' + pct + '%"></i></span>' +
      (when ? '<span class="asof">as of ' + esc(when) + '</span>' : '');
    budgetEl.hidden = false;
  }

  function laneSub(a) {
    var bits = [];
    if (a.runsPerDay != null) bits.push(a.runsPerDay === 0 ? 'no run cap' : a.runsPerDay + ' runs/day');
    if (isNum(a.capUsd)) bits.push('cap ' + money(a.capUsd).replace(/\.00$/, '') + '/mo');
    var line1 = (bits.length || a.week) ? [a.model].concat(bits).join(' \u00b7 ') : '';
    var w = a.week;
    var line2 = (w && isNum(w.runs)) ? '7d: ' + w.runs + ' runs \u00b7 ' + w.busyH + ' h \u00b7 ' + money(w.spendUsd) + ' \u00b7 ' + w.timeouts + ' timeouts' : '';
    return (line1 ? '<span class="lane-sub" title="' + esc(line1) + '">' + esc(line1) + '</span>' : '') +
      (line2 ? '<span class="lane-sub" title="' + esc(line2) + '">' + esc(line2) + '</span>' : '');
  }

  function renderLanes(d) {
    lanesEl.innerHTML = d.agents.map(function (a) {
      var task = a.task ? esc(a.task) : 'No current task';
      return '<article class="lane" title="' + esc(a.name + ' — ' + a.role) + '">' +
        '<span class="lane-top">' +
          '<img class="avatar" src="' + esc(a.avatar) + '" alt="" width="36" height="36" loading="lazy">' +
          '<span class="lane-id"><span class="name">' + esc(a.name) + '</span><span class="role">' + esc(a.role) + '</span></span>' +
          '<span class="state state-' + esc(a.state) + '"><span class="dot" aria-hidden="true"></span>' + esc(a.state) + '</span>' +
        '</span>' +
        laneSub(a) +
        '<span class="lane-task' + (a.task ? '' : ' empty') + '">' + task + '</span>' +
        '<span class="lane-foot"><span class="model" title="' + esc(a.model) + '">' + esc(a.model) + '</span>' +
        '<span class="last" title="' + esc(a.lastActiveAt ? abs(a.lastActiveAt) : 'No activity recorded') + '">' +
        (a.lastActiveAt ? esc(rel(a.lastActiveAt)) + ' ago' : '—') + '</span></span>' +
      '</article>';
    }).join('');
  }

  function renderCard(t, compact) {
    var r = rosterOf(t.agent);
    var who = r
      ? '<span class="who"><span class="mark" data-agent="' + esc(r.id) + '" aria-hidden="true"></span><span class="name">' + esc(r.name) + '</span></span>'
      : '<span class="who anon"><span class="name">' + esc(t.agent === 'unassigned' ? 'Unassigned' : t.agent) + '</span></span>';
    var issue = t.url
      ? '<a class="issue" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer" aria-label="Open issue ' + esc(t.id) + ' in section9-hq">#' + esc(t.id) + '</a>'
      : '<span class="issue">#' + esc(t.id) + '</span>';
    var pr = (t.pr && /^https?:\/\//i.test(t.pr))
      ? '<a class="pr" href="' + esc(t.pr) + '" target="_blank" rel="noopener noreferrer" aria-label="Open the pull request for issue ' + esc(t.id) + '">PR \u2197</a>'
      : '';
    var wt = cleanWaits(t.waitsText);
    var waitsOn = wt ? '<p class="waits-on"><span class="waits-k">waits on</span> ' + esc(wt) + '</p>' : '';
    var badge = (compact && t.unblocks != null)
      ? '<span class="unblocks" title="Open tasks that clear when this does">unblocks ' + esc(t.unblocks) + '</span>' : '';
    return '<article class="card waits-' + esc(t.waits) + (compact ? ' is-start' : '') + '">' +
      '<div class="card-top"><span class="top-left">' + issue + pr + '</span>' +
        '<span class="age" title="' + esc(t.updated ? 'updated ' + abs(t.updated) : 'update time unknown') + '">' +
        esc(t.updated ? rel(t.updated) : '—') + '</span></div>' +
      '<h3 class="title">' + esc(t.title) + '</h3>' +
      waitsOn +
      '<div class="card-foot">' + who + badge + '</div>' +
    '</article>';
  }

  function renderStart(d) {
    var top = startHere(d);
    if (!top.length) { startEl.innerHTML = '<p class="empty">Nothing is waiting on Petter.</p>'; return; }
    startEl.innerHTML = top.map(function (t) { return renderCard(t, true); }).join('');
  }

  function renderChips(d) {
    var counts = {};
    d.tasks.forEach(function (t) { counts[t.agent] = (counts[t.agent] || 0) + 1; });
    var out = ['<button type="button" class="chip" data-agent="all" aria-pressed="' +
      (state.filter === 'all' ? 'true' : 'false') + '">All<span class="chip-count">' + d.tasks.length + '</span></button>'];
    ROSTER.forEach(function (r) {
      var n = counts[r.id] || 0;
      out.push('<button type="button" class="chip" data-agent="' + esc(r.id) + '" aria-pressed="' +
        (state.filter === r.id ? 'true' : 'false') + '" title="' + esc('Show only ' + r.name + '\u2019s tasks') + '">' +
        '<span class="mark" data-agent="' + esc(r.id) + '" aria-hidden="true"></span>' + esc(r.name) +
        '<span class="chip-count">' + n + '</span></button>');
    });
    chipsEl.innerHTML = out.join('');
  }

  function renderFilter(d) {
    if (state.filter === 'all') { filterLineEl.innerHTML = ''; return; }
    var r = rosterOf(state.filter);
    filterLineEl.innerHTML = '<span>showing <b>' + esc(r ? r.name : state.filter) + '</b></span>' +
      '<button type="button" class="clear-filter">show all agents</button>';
  }

  function renderColumns(d) {
    var tasks = filteredTasks(d);
    var by = {};
    WAITS.forEach(function (w) { by[w.key] = []; });
    tasks.forEach(function (t) { by[t.waits].push(t); });
    WAITS.forEach(function (w) {
      by[w.key].sort(function (a, b) { return (Date.parse(b.updated) || 0) - (Date.parse(a.updated) || 0); });
    });
    columnsEl.innerHTML = WAITS.map(function (w, idx) {
      var list = by[w.key];
      return '<section class="column waits-' + esc(w.key) + '" aria-labelledby="col-' + esc(w.key) + '">' +
        '<div class="column-head"><h3 id="col-' + esc(w.key) + '">' + esc(w.label) + '</h3>' +
          '<span class="pill" aria-label="' + esc(list.length + ' tasks') + '">' + list.length + '</span></div>' +
        '<p class="col-sub">' + esc(w.sub) + '</p>' +
        '<div class="cards">' + (list.length ? list.map(function (t) { return renderCard(t, false); }).join('') : (idx === 0 ? '<p class="empty">Nothing here</p>' : '')) + '</div>' +
      '</section>';
    }).join('');
  }

  function render() {
    if (!state.data) return;
    renderMeta(state.data);
    renderBudget(state.data);
    renderLanes(state.data);
    renderStart(state.data);
    renderChips(state.data);
    renderFilter(state.data);
    renderColumns(state.data);
  }

  function showError(msg) {
    columnsEl.innerHTML = '<div class="error" role="alert">' + esc(msg) + '</div>';
    metaEl.textContent = 'live feed unavailable';
  }

  function apply(raw, source) {
    state.data = normalize(raw);
    state.source = source;
    render();
    var d = state.data;
    var petter = d.tasks.filter(function (t) { return t.waits === 'petter'; }).length;
    liveEl.textContent = 'Board updated. ' + d.tasks.length + ' open tasks, ' + petter + ' waiting on Petter.' +
      (source === 'file' || source === 'sample' ? ' Sample data.' : '');
  }

  function load() {
    if (location.protocol === 'file:') {
      var el = document.getElementById('board-sample');
      try { apply(JSON.parse(el.textContent), 'file'); }
      catch (e) { showError('The sample data is not valid JSON.'); }
      return;
    }
    fetch('./board.json', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (raw) {
      apply(raw, 'live');
    }).catch(function () {
      fetch('./board-sample.json', { cache: 'no-store' }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (raw) {
        apply(raw, 'sample');
      }).catch(function () {
        showError('Could not load board.json or board-sample.json.');
      });
    });
  }

  // Theme: saved choice, else the OS preference, default dark.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('s9-board-theme'); } catch (e) {}
    if (saved !== 'light' && saved !== 'dark') {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    setTheme(saved);
  })();

  document.addEventListener('click', function (e) {
    var el = e.target;
    var chip = el.closest ? el.closest('.chip') : null;
    if (chip) {
      var id = chip.getAttribute('data-agent');
      state.filter = (id === 'all' || state.filter === id) ? 'all' : id;
      render();
      return;
    }
    var clear = el.closest ? el.closest('.clear-filter') : null;
    if (clear) { state.filter = 'all'; render(); return; }
    var th = el.closest ? el.closest('.theme-toggle') : null;
    if (th) { setTheme(themeMode() === 'light' ? 'dark' : 'light'); render(); }
  });

  load();
  setInterval(function () { if (location.protocol !== 'file:') load(); }, POLL_MS);
})();
</script>
</body>
</html>
