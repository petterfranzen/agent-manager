# The team as code. scripts/paperclip-apply.py applies this to Paperclip on the
# VM (docs/RUNBOOK.md, step 7). Safe to re-run: it changes only what differs.
#
# Routines stay `active = false` (created paused) until the Major has done a
# supervised first run. Then flip them to true in a PR and re-apply.
#
# The agents' budgets add up to the company's $19 (Petter, 30 Oct), under the
# OpenRouter key's $20 cap.

[company]
name = "Section 9"
# $19: Paperclip pauses the agents just before the OpenRouter key's hard $20
# cap, so a run is never cut off halfway by an empty key.
budget_monthly_cents = 1900
# Hermes reports tokens, not dollars, so every run is "unpriced" usage. With
# "block" (Paperclip's default) one run pauses the agent and the whole company.
# "allow" lets those runs through; the real money arrives separately, booked
# every hour from OpenRouter by deploy/spend-report.py, and the budgets below
# enforce against that.
unpriced_usage = "allow"

# Hermes gateway adapter settings shared by every agent. The gateway key is
# not here: the script reads API_SERVER_KEY from /etc/agent-manager/hermes.env.
[defaults]
api_base_url = "http://127.0.0.1:8642"
paperclip_api_url = "http://127.0.0.1:3100"
session_key_strategy = "issue"
timeout_sec = 600

[[agents]]
name = "Tachikoma"
role = "engineer"
title = "Nightly builder"
brief = "agents/nightly-builder.md"
avatar = "agents/avatars/tachikoma.png"
# What's left of the $19 after the others. Real nights cost cents (about $1.50
# for the whole team in October's first busy week), so $4 is ample.
budget_monthly_cents = 400
timeout_sec = 10800

[agents.routine]
title = "Nightly build"
description = "Build tonight's app, following your brief."
cron = "0 1 * * *"
timezone = "Europe/Stockholm"
active = true

