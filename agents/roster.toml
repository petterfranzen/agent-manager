# The team as code. scripts/paperclip-apply.py applies this to Paperclip on the
# VM (docs/RUNBOOK.md, step 7). Safe to re-run: it changes only what differs.
#
# Routines stay `active = false` (created paused) until the Major has done a
# supervised first run. Then flip them to true in a PR and re-apply.
#
# The budgets add up to $20, the OpenRouter key's monthly cap.

[company]
name = "Section 9"
budget_monthly_cents = 2000
# Hermes reports tokens, not dollars, so every run is "unpriced" usage. With
# "block" (Paperclip's default) one run pauses the agent and the whole company.
# "allow" lets Paperclip record $0 for those runs, so the OpenRouter key's $20
# monthly cap is the real limit and the budgets here are bookkeeping.
unpriced_usage = "allow"

# Hermes gateway adapter settings shared by every agent. The gateway key is
# not here: the script reads API_SERVER_KEY from /etc/agent-manager/hermes.env.
[defaults]
api_base_url = "http://127.0.0.1:8642"
paperclip_api_url = "http://127.0.0.1:3100"
session_key_strategy = "issue"
timeout_sec = 600

[[agents]]
name = "Tachikoma"
role = "engineer"
title = "Nightly builder"
brief = "agents/nightly-builder.md"
avatar = "agents/avatars/tachikoma.png"
budget_monthly_cents = 1000
