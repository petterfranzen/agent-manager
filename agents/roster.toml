# The team as code. vps/dispatch.py reads this on the VPS: agent names, models,
# timeouts and routines (docs/RUNBOOK.md).
#
# `model` is the OpenRouter model id an agent runs on, when it is not the
# default (deepseek/deepseek-v4.1-flash). The dispatcher sends it per run and
# only ever for an id the root-only [models].allow list in /etc/section9/limits.toml
# holds, so this file cannot pick an arbitrary or xAI model. To roll an agent back,
# pin it in that file (one line) -- no change here (section9-hq #101).
#
# Routines stay `active = false` (created paused) until the Major has done a
# supervised first run. Then flip them to true in a PR and re-apply.
#
# The agents' budgets add up to the company's $19 (Petter, 30 Oct), under the
# OpenRouter key's $20 cap.

[company]
name = "Section 9"
# $19: Paperclip pauses the agents just before the OpenRouter key's hard $20
# cap, so a run is never cut off halfway by an empty key.
budget_monthly_cents = 1900
# Hermes reports tokens, not dollars, so every run is "unpriced" usage. With
# Legacy Paperclip setting, unused since 31 Oct. Money is read from OpenRouter
# by `vps/dispatch.py spend` and shown in the "Spend" issue in section9-hq.
unpriced_usage = "allow"

# Hermes gateway adapter settings shared by every agent. The gateway key is
# not here: the script reads API_SERVER_KEY from /etc/agent-manager/hermes.env.
[defaults]
api_base_url = "http://127.0.0.1:8642"
paperclip_api_url = "http://127.0.0.1:3100"
session_key_strategy = "issue"
timeout_sec = 600

[[agents]]
name = "Tachikoma"
role = "engineer"
title = "Nightly builder"
brief = "agents/nightly-builder.md"
model = "moonshotai/kimi-k3.1-pro"     # Petter, 5 Nov trial (#101); kept 10 Nov, review 17 Nov
avatar = "agents/avatars/tachikoma.png"
# Petter, 10 Nov: more budget for richer portfolio apps, on Kimi K3.1 Pro.
# Reviewed 17 Nov against the DeepSeek nights; back to DeepSeek if not richer.
budget_monthly_cents = 1000
timeout_sec = 10800

[agents.routine]
title = "Nightly build"
description = "Build tonight's app, following your brief."
cron = "0 1 * * *"
timezone = "Europe/Stockholm"
active = true
priority = "high"   # Petter, 6 Nov: one build a night must happen every night, so it jumps the queue

[[agents]]
name = "Batou"
role = "engineer"
title = "Coder"
brief = "agents/coder.md"
avatar = "agents/avatars/batou.png"
budget_monthly_cents = 400
# 40 min, down from 1 h: 16 runs in the week to 7 Nov hit the old ceiling and burned 16 h
# with no output, 11 of them his. A task that genuinely needs longer should say so.
timeout_sec = 2400

[[agents]]
name = "Ishikawa"
role = "researcher"
title = "Researcher"
brief = "agents/researcher.md"
avatar = "agents/avatars/ishikawa.png"
budget_monthly_cents = 500
timeout_sec = 3600

[[agents]]
name = "Togusa"
role = "general"
title = "QA and UI/UX reviewer"
brief = "agents/backup-coordinator.md"
avatar = "agents/avatars/togusa.png"
budget_monthly_cents = 300
# 40 min for QA: 5 of the same 16 timed-out runs were his, mostly stuck on CI, not thinking.
timeout_sec = 2400

# GitHub can't wake Paperclip (it sits behind Cloudflare Access), so Togusa
# sweeps for ready agent PRs twice a day: after the nightly build, before the
# morning check-in, and again before the evening one. The Major assigns him a
# PR directly when it can't wait.
[agents.routine]
title = "QA sweep"
description = "Review every ready agent PR that has no QA verdict since its last push, following your brief. Also check whether the Major has been silent for 12 hours."
cron = "40 5,16 * * *"
timezone = "Europe/Stockholm"
active = false

[[agents]]
name = "Saito"
role = "devops"
title = "Senior thinker and ops (read-only)"
brief = "agents/ops.md"
# model: the default, deepseek/deepseek-v4.1-flash (Petter, 8 Nov: Sonnet trial ended, #205)
avatar = "agents/avatars/saito.png"
budget_monthly_cents = 300
timeout_sec = 3600

[agents.routine]
title = "Morning ops report"
description = "Write the morning ops report, following your brief; on Mondays, also run the weekly audit."
cron = "30 6 * * *"
timezone = "Europe/Stockholm"
active = false
