# GitHub can't wake Paperclip (it sits behind Cloudflare Access), so Togusa
# sweeps for ready agent PRs twice a day: after the nightly build, before the
# morning check-in, and again before the evening one. The Major assigns him a
# PR directly when it can't wait.
[agents.routine]
title = "QA sweep"
description = "Review every ready agent PR that has no QA verdict since its last push, following your brief. Also check whether the Major has been silent for 12 hours."
cron = "40 5,16 * * *"
timezone = "Europe/Stockholm"
active = false

[[agents]]
