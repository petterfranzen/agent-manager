# Hermes config, mounted read-only at /opt/data/config.yaml. Keys come from
# /etc/agent-manager/hermes.env, never from here. See docs/DESIGN.md "Models".

# This default is the model for a request that names none. The dispatcher names
# one on every run (vps/dispatch.py, from agents/roster.toml): it sends `model`
# and `provider: openrouter`, so the gateway switches the executing model for
# that turn only and never rewrites this file (section9-hq #101).
model:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash

# OpenRouter routing. The account also enforces ZDR and no training; these
# repeat it per request so a settings change can't silently loosen it.
provider_routing:
  sort: price
  data_collection: "deny"
  ignore: ["x-ai"]          # Petter's choice: no xAI, ever.
  # Per-model pins (#101). Hermes overlays these on the flat block above for the
  # model the agent is currently on, so each trial model gets its own ZDR-only
  # provider set and still cannot reach a non-ZDR or xAI provider. Slugs are from
  # OpenRouter's ZDR endpoint list, 5 Nov; `only` is a hard gate -- if a run ever
  # fails with "no provider available", check the slugs here first.
  models:
    "anthropic/claude-sonnet-5.5":
      sort: price
      data_collection: "deny"
      ignore: ["x-ai"]
      only: ["amazon-bedrock", "google-vertex"]
    "moonshotai/kimi-k3.1-pro":
      sort: price
      data_collection: "deny"
      ignore: ["x-ai"]
      only: ["fireworks", "together", "deepinfra", "parasail", "nebius", "moonshotai"]

# Tried in order when the primary fails (429/5xx/401/403/404), per turn.
# DeepSeek first (#101): an agent on a $2/$10 model must fail to the cheapest
# model, never to a dearer one. An entry equal to the primary is skipped, so a
# DeepSeek agent still falls through to GLM exactly as before.
fallback_providers:
  - provider: openrouter
    model: deepseek/deepseek-v4.1-flash
  - provider: openrouter
    model: z-ai/glm-5.3-flash
  - provider: openrouter
    model: minimax/minimax-m3
  - provider: openrouter
    model: anthropic/claude-haiku-5.5

# Subagents: pinned explicitly, with their own fallback chain (avoids the
# credential mix-up fixed in hermes-agent#90009). Flat by default; Paperclip's
# org chart is the hierarchy, not deep Hermes nesting.
delegation:
  provider: openrouter
  model: deepseek/deepseek-v4.1-flash
  fallback_providers:
    - provider: openrouter
      model: z-ai/glm-5.3-flash
  max_spawn_depth: 1
  # One child at a time: the whole stack now shares 0.70 of one vCPU (section9-hq #34),
  # and two concurrent children only lengthen a night. They share the sandbox either way.
  max_concurrent_children: 1

terminal:
  backend: ssh              # the sandbox container; host/user/key come from env
  cwd: /home/agent/work
  timeout: 600              # builds can take a while
  persistent_shell: true
  env_passthrough: []       # nothing from the Hermes container reaches commands

memory:
  memory_enabled: true
  write_approval: false

# Web dashboard (enabled in vps/compose.yaml). Behind Cloudflare Access at
# hq.sectionnine.dev; the login lives in /etc/section9/hermes.env. Themes are
# YAML files in /opt/data/dashboard-themes (see vps/hq-status.py crew).
dashboard:
  public_url: https://hq.sectionnine.dev
  trusted_proxies: ["127.0.0.1"]      # cloudflared on the host; exact IPs only
  theme: ghost
