name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --no-banner --redact .

  config:
    name: Compose and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Placeholder secrets files (CI only)
        run: |
          sudo mkdir -p /etc/agent-manager
          for f in postgres paperclip hermes sandbox; do echo "CI_PLACEHOLDER=1" | sudo tee /etc/agent-manager/$f.env >/dev/null; done
          sudo touch /etc/agent-manager/sandbox_authorized_keys
      - name: docker compose config
        run: docker compose -f compose.yaml config --quiet
      - name: Images pinned by digest
        run: |
          set -euo pipefail
          bad=$(grep -E '^\s*image:' compose.yaml | grep -v '@sha256:' || true)
          [ -z "$bad" ] || { echo "Unpinned image(s):"; echo "$bad"; exit 1; }
      - name: No xAI models, ZDR routing on
        run: |
          set -euo pipefail
          ! grep -RInE 'x-ai/|grok' --include='*.yaml' --include='*.yml' --include='*.md' hermes agents || { echo "xAI model referenced"; exit 1; }
          python3 - <<'EOF'
          import yaml
          c = yaml.safe_load(open("hermes/config.yaml"))
          assert c["provider_routing"]["data_collection"] == "deny"
          assert "x-ai" in c["provider_routing"]["ignore"]
          assert c["terminal"]["backend"] == "ssh"
          assert c["terminal"]["env_passthrough"] == []
          print("hermes config ok")
          EOF
      - name: No listeners beyond loopback
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --format json > /tmp/compose.json
          python3 - <<'EOF'
          import json
          svc = json.load(open("/tmp/compose.json"))["services"]
          env = svc["hermes"].get("environment", {})
          for k in ("HERMES_DASHBOARD", "WEBHOOK_ENABLED"):
              assert env.get(k) in ("0", "false"), f"hermes {k} must be 0 or false, got {env.get(k)!r}"
          for name, s in svc.items():
              for p in s.get("ports", []):
                  assert name == "paperclip", f"{name} publishes a port: {p}"
                  assert p.get("host_ip") == "127.0.0.1", f"paperclip publishes beyond loopback: {p}"
          print("listeners ok")
          EOF

  roster:
    name: Roster script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: paperclip-apply.py against a fake Paperclip
        run: python3 -m unittest scripts/test_paperclip_apply.py scripts/test_spend_report.py scripts/test_crew_status.py scripts/test_heal_accounting.py scripts/test_decommission.py scripts/test_vps.py

  vps:
    name: VPS stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Placeholder secrets files (CI only)
        run: |
          sudo mkdir -p /etc/section9
          for f in hermes sandbox; do echo "CI_PLACEHOLDER=1" | sudo tee /etc/section9/$f.env >/dev/null; done
          sudo touch /etc/section9/sandbox_authorized_keys /etc/section9/hermes_ssh_key
      - name: docker compose config, digest pins, limits, loopback only
        run: |
          set -euo pipefail
          docker compose -f vps/compose.yaml config --quiet
          bad=$(grep -E '^\s*image:' vps/compose.yaml | grep -v '@sha256:' || true)
          [ -z "$bad" ] || { echo "Unpinned image(s):"; echo "$bad"; exit 1; }
          ! grep -InE 'x-ai/|grok' vps/compose.yaml
          docker compose -f vps/compose.yaml config --format json > /tmp/vps.json
          python3 - <<'EOF'
          import json
          svc = json.load(open("/tmp/vps.json"))["services"]
          assert set(svc) == {"hermes", "sandbox", "hq"}, set(svc)
          h, s, q = svc["hermes"], svc["sandbox"], svc["hq"]
          assert q["mem_limit"] == str(64 * 2**20), q["mem_limit"]
          assert [(p["host_ip"], p["target"], p["published"]) for p in q["ports"]] == [("127.0.0.1", 8090, "8090")], q["ports"]
          assert h["mem_limit"] == str(2**30) and s["mem_limit"] == str(2 * 2**30) and s["memswap_limit"] == str(3 * 2**30)
          # Hostinger's credit budget: 0.40 (sandbox) + 0.30 (hermes) = 0.45 over baseline. Keep
          # SANDBOX_CORES/HERMES_CORES in vps/dispatch.py in step.
          assert (str(h.get("cpus")), str(s.get("cpus"))) == ("0.3", "0.4"), (h.get("cpus"), s.get("cpus"))
          assert h["network_mode"] == "host" and "ports" not in h
          assert h["environment"]["API_SERVER_HOST"] == "127.0.0.1"
          assert h["environment"]["WEBHOOK_ENABLED"] in ("0", "false")
          e = h["environment"]    # the dashboard: on, loopback only
          assert (e["HERMES_DASHBOARD"], e["HERMES_DASHBOARD_HOST"], e["HERMES_DASHBOARD_PORT"]) == ("1", "127.0.0.1", "9119"), e
          assert any(v["target"] == "/opt/data/dashboard-themes" and v.get("read_only") for v in h["volumes"]), h["volumes"]
          assert [(p["host_ip"], p["target"]) for p in s["ports"]] == [("127.0.0.1", 22)]
          print("vps compose ok")
          EOF
      - name: install.sh and the systemd units
        run: |
          set -euo pipefail
          for f in vps/*.sh; do bash -n "$f"; done
          shellcheck vps/*.sh
          if ! command -v systemd-analyze >/dev/null; then echo "no systemd-analyze; skipping"; exit 0; fi
          sudo mkdir -p /opt/agent-manager/vps
          sudo install -m 0755 vps/dispatch.py vps/hq-status.py vps/sync.sh /opt/agent-manager/vps/
          systemd-analyze verify vps/systemd/section9-*.service vps/systemd/section9-*.timer

  deploy:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck deploy/*.sh
      - name: systemd-analyze verify
        run: |
          set -euo pipefail
          if ! command -v systemd-analyze >/dev/null; then
            echo "systemd-analyze is not on this runner; skipping"
            exit 0
          fi
          # verify checks that ExecStart exists, so put the script where the unit expects it.
          sudo install -m 0755 deploy/vm-sync.sh /usr/local/sbin/agent-manager-sync
          sudo install -m 0755 deploy/spend-report.py /usr/local/sbin/agent-manager-spend
          sudo install -m 0755 deploy/crew-status.py /usr/local/sbin/agent-manager-crew-status
          systemd-analyze verify deploy/agent-manager-sync.service deploy/agent-manager-sync.timer \
            deploy/agent-manager-spend.service deploy/agent-manager-spend.timer \
            deploy/agent-manager-crew-status.service

  sandbox:
    name: Sandbox image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t sandbox:ci sandbox
      - name: Start with a test key and a fake GitHub token
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f /tmp/ci_key
          cp /tmp/ci_key.pub /tmp/authorized_keys
          # As on the VM: root-owned, not writable by others (sshd StrictModes).
          sudo chown root:root /tmp/authorized_keys && sudo chmod 0644 /tmp/authorized_keys
          docker run -d --name sb -p 127.0.0.1:2222:22 \
            -e GH_TOKEN=ci-fake-token -e OPENROUTER_API_KEY=must-not-leak \
            -v /tmp/authorized_keys:/etc/ssh/authorized_keys/agent:ro sandbox:ci
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && break; sleep 1; done
      - name: Checks over SSH, as Hermes would connect
        run: |
          set -euo pipefail
          trap 'docker logs sb 2>&1 | tail -20' ERR
          s() { ssh -i /tmp/ci_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null agent@127.0.0.1 "$@"; }
          [ "$(s whoami)" = agent ]
          s 'git --version && gh --version | head -1 && gitleaks version && mise --version'
          s 'test -s ~/.git-credentials && grep -q ci-fake-token ~/.git-credentials'
          # gh must accept its config as written (no migration attempt).
          ! s 'gh config get git_protocol -h github.com 2>&1' | grep -qi 'migrat'
          [ "$(s 'gh config get git_protocol -h github.com')" = https ]
          s 'test "$(stat -c %a ~/.git-credentials)" = 600'
          # The container env (where a model key could sit) must not reach SSH sessions.
          ! s 'env' | grep -q must-not-leak
          ! s 'env' | grep -q ci-fake-token
          # s9-task finds the token in ~/.git-credentials (SSH sessions have no GH_TOKEN),
          # never prints it, and needs no GitHub here: point it at a closed loopback port.
          # Capture first: s9-task exits non-zero on these, which pipefail would count.
          help=$(s 's9-task --help')
          echo "$help" | grep -q 's9-task --as <Name> status'
          out=$(s 'S9_API_URL=http://127.0.0.1:9 s9-task --as Batou comment 1 hi 2>&1' || true)
          echo "$out" | grep -q 'no response'
          ! echo "$out" | grep -q ci-fake-token
          out=$(s 's9-task comment 1 hi 2>&1' || true)
          echo "$out" | grep -q 'say who you are'
          out=$(s 'S9_API_URL=http://example.com s9-task --as Batou comment 1 hi 2>&1' || true)
          echo "$out" | grep -q 'must be https'
          # Browser: shoot renders a local page to a non-empty PNG at desktop and
          # phone width and reports its console errors (SSH sessions get the env via pam_env).
          s 'node --version && test -r /opt/skills/ponytail/ponytail-review/SKILL.md && ! test -e /home/agent/.hermes/skills/impeccable'
          [ "$(s 'echo $PLAYWRIGHT_BROWSERS_PATH')" = /opt/ms-playwright ]
          s 'mkdir -p /tmp/page && printf "%s\n" "<!doctype html><meta name=viewport content=\"width=device-width\"><h1>QA smoke</h1><script>console.error(\"ci-boom\")</script>" > /tmp/page/index.html'
          out=$(s 'shoot /tmp/page /tmp/page/desktop.png && shoot /tmp/page/index.html /tmp/page/phone.png --mobile')
          echo "$out"
          echo "$out" | grep -q 'console.error: ci-boom'
          s 'test -s /tmp/page/desktop.png && test -s /tmp/page/phone.png'
          [ "$(s 'python3 -c "import struct,sys; print(struct.unpack(\">I\", open(sys.argv[1],\"rb\").read()[16:20])[0])" /tmp/page/phone.png')" = 390 ]
          # No browser left behind (the kernel's process name is cut to 15 characters).
          [ -z "$(s 'pgrep -x chrome-headless || true')" ]
          # No root login, no password login.
          ! ssh -i /tmp/ci_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@127.0.0.1 true
          echo "sandbox ok"
      - name: Host key survives a restart
        run: |
          set -euo pipefail
          before=$(docker exec sb ssh-keygen -lf /etc/ssh/hostkeys/ssh_host_ed25519_key.pub)
          docker restart sb >/dev/null; sleep 3
          after=$(docker exec sb ssh-keygen -lf /etc/ssh/hostkeys/ssh_host_ed25519_key.pub)
          # Without a volume the key lives in the container layer, which a restart keeps.
          [ "$before" = "$after" ]
