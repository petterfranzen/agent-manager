# Agent stack for the Hetzner VM. See docs/DESIGN.md and docs/RUNBOOK.md.
# Secrets live in /etc/agent-manager/*.env (root-only), one file per service,
# never in this public repo. Images are pinned by digest; Dependabot proposes
# updates, merged only once a release is 24 h old (patch rule).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    env_file: /etc/agent-manager/postgres.env   # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  paperclip:
    image: ghcr.io/petterfranzen/paperclip-slim:2026.1023.0@sha256:11f779b7d7f9cace740878fc9504ed9a08f285bd318129ed0a131f28ebd311b1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: /etc/agent-manager/paperclip.env   # BETTER_AUTH_SECRET, DATABASE_URL
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_PUBLIC_URL: https://hq.sectionnine.dev
      NODE_OPTIONS: --max-old-space-size=512
      DO_NOT_TRACK: "1"
      # The board is claimed; close email sign-up. Board API keys and the CLI login don't use it.
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "true"
      # No fetch of the announcements feed from pages.paperclip.ing.
      PAPERCLIP_ANNOUNCEMENTS_ENABLED: "false"
    # Loopback only: cloudflared on the host publishes it behind Cloudflare Access.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - paperclip-data:/paperclip
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  hermes:
    image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      - paperclip
      - sandbox
    # Shares paperclip's network namespace: Paperclip reaches the gateway on
    # 127.0.0.1:8642, the only plain-HTTP target its hermes_gateway adapter allows.
    network_mode: "service:paperclip"
    env_file: /etc/agent-manager/hermes.env   # OPENROUTER_API_KEY, API_SERVER_KEY
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      # Off on purpose: both would listen on all interfaces, reachable from the sandbox.
      HERMES_DASHBOARD: "0"
      WEBHOOK_ENABLED: "false"
      # Commands run in the sandbox over SSH; Hermes never forwards provider
      # credentials over SSH, so the OpenRouter key can't reach agent commands.
      TERMINAL_SSH_HOST: sandbox
      TERMINAL_SSH_USER: agent
      TERMINAL_SSH_KEY: /opt/data/ssh/id_ed25519
    volumes:
      - hermes-data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      # Owned by UID 10000 (the image's hermes user), mode 0400; see scripts/new-secrets.sh.
      - /etc/agent-manager/hermes_ssh_key:/opt/data/ssh/id_ed25519:ro
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  sandbox:
    build: ./sandbox
    restart: unless-stopped
    env_file: /etc/agent-manager/sandbox.env   # GH_TOKEN (fine-grained, ghost-in-the-machine only)
    volumes:
      - /etc/agent-manager/sandbox_authorized_keys:/etc/ssh/authorized_keys/agent:ro
      # One task_bridge key per agent, owned by the agent user, mode 0400 (paperclip-apply.py).
      - /etc/agent-manager/bridge-keys:/run/paperclip-keys:ro
      - sandbox-hostkeys:/etc/ssh/hostkeys
      - sandbox-work:/home/agent/work
      - sandbox-tools:/home/agent/.local/share/mise
    # One headless browser at a time (shoot's lock) fits inside this with a
    # build: a shoot peaks at ~0.2 GB. Swap is capped at 0.5 GB on top, so a
    # runaway page or build is OOM-killed here instead of pushing
    # flight-tracker's page cache out (docs/DESIGN.md, Memory).
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 512
    logging: *logging

volumes:
  pgdata:
  paperclip-data:
  hermes-data:
  sandbox-hostkeys:
  sandbox-work:
  sandbox-tools:
